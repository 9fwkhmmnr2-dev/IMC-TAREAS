<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMC TAREAS - Instituto Magdalena de Canossa</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>body{font-family:Inter;background:#FAFAFA;color:#111}.card{background:#fff;border:1px solid #E5E5E5;border-radius:12px}.nav-active{background:#111;color:#fff}</style>
</head>
<body>
<div id="auth" class="min-h-screen flex items-center justify-center p-6">
 <div class="w-full max-w-[440px] bg-white border border-neutral-200 rounded-xl p-8">
  <div class="flex items-center gap-3 mb-8">
   <img src="logo.png" class="w-12 h-12 object-contain rounded-full border border-neutral-200">
   <div><p class="font-serif text-[22px] leading-none tracking-tight">IMC TAREAS</p><p class="text-[11px] tracking-widest uppercase text-neutral-500 mt-1">Instituto Magdalena de Canossa</p></div>
  </div>
  <div class="flex gap-2 mb-6 p-1 bg-neutral-100 rounded-full"><button id="tLogin" class="flex-1 py-2 rounded-full bg-black text-white text-sm">Ingresar</button><button id="tReg" class="flex-1 py-2 rounded-full text-sm text-neutral-600">Registrarse</button></div>
  <form id="fLogin" class="space-y-3">
   <input id="lCurso" placeholder="Curso / División" class="w-full px-4 py-3 rounded-lg border bg-white text-sm">
   <input id="lPass" type="password" placeholder="Contraseña" class="w-full px-4 py-3 rounded-lg border bg-white text-sm">
   <button class="w-full bg-black text-white py-3 rounded-lg text-sm font-medium mt-2">Entrar</button>
  </form>
  <form id="fReg" class="space-y-3 hidden">
   <div class="grid grid-cols-2 gap-3"><input id="rNom" required placeholder="Nombre" class="px-4 py-3 rounded-lg border text-sm"><input id="rApe" required placeholder="Apellido" class="px-4 py-3 rounded-lg border text-sm"></div>
   <input id="rCurso" required placeholder="Curso / División (ej: 2do A)" class="w-full px-4 py-3 rounded-lg border text-sm">
   <input id="rPass" type="password" required placeholder="Contraseña" class="w-full px-4 py-3 rounded-lg border text-sm">
   <input id="rPass2" type="password" required placeholder="Confirmar contraseña" class="w-full px-4 py-3 rounded-lg border text-sm">
   <button class="w-full bg-black text-white py-3 rounded-lg text-sm font-medium mt-2">Crear cuenta</button>
  </form>
 </div>
</div>

<div id="app" class="hidden">
 <aside class="hidden md:flex fixed left-0 top-0 h-screen w-[280px] bg-white border-r border-neutral-200 flex-col">
  <div class="p-6 border-b flex items-center gap-3"><img src="logo.png" class="w-9 h-9 rounded-full border"><div><p class="font-serif leading-none">IMC TAREAS</p><p class="text-[10px] uppercase text-neutral-500 tracking-widest">Canossa</p></div></div>
  <nav id="side" class="flex-1 p-3 space-y-1 overflow-auto"></nav>
  <div class="p-4 border-t"><div class="flex items-center gap-3"><div id="av" class="w-8 h-8 bg-black text-white rounded-full flex items-center justify-center text-xs"></div><div class="flex-1 min-w-0"><p id="uName" class="text-sm font-medium truncate"></p><p id="uCurso" class="text-xs text-neutral-500 truncate"></p></div><button onclick="logout()" class="text-xs underline">Salir</button></div></div>
 </aside>
 <main class="md:ml-[280px] min-h-screen"><header class="sticky top-0 z-10 bg-[#FAFAFA]/80 backdrop-blur border-b px-6 md:px-10 h-[64px] flex items-center justify-between"><h1 id="hTitle" class="font-serif text-2xl"></h1><button onclick="openM('tarea')" class="bg-black text-white px-4 py-2 rounded-lg text-sm">Nueva tarea</button></header><div id="content" class="p-6 md:p-10 max-w-[1200px]"></div></main>
 <nav id="bottom" class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-20"></nav>
</div>
<div id="modal" class="fixed inset-0 bg-black/40 hidden z-50 items-center justify-center p-4"><div id="mBody" class="bg-white rounded-xl w-full max-w-[560px] p-6 max-h-[90vh] overflow-auto"></div></div>
<script>
const HORARIO_BASE=[
{dia:'Lunes',salida:'13:30',bloques:[{h:'1ª y 2ª hora',m:'Biología',p:'Andrea Espinazo'},{h:'3ª y 4ª hora',m:'Religión',p:'Silvana Salinas'},{h:'5ª hora',m:'Inglés',p:'Lorena Botto'},{h:'6ª hora',m:'Plástica',p:'Carla Rivera'}]},
{dia:'Martes',salida:'11:20',bloques:[{h:'1ª y 2ª hora',m:'Físico-Química',p:'Andrea Espinazo'},{h:'3ª hora',m:'Ciudadanía',p:'Pablo Alonso'},{h:'4ª hora',m:'Plástica',p:'Carla Rivera'}]},
{dia:'Miércoles',salida:'13:30',bloques:[{h:'1ª y 2ª hora',m:'Matemática',p:'Hayde Hualpa'},{h:'3ª y 4ª hora',m:'Lengua',p:'Julieta'},{h:'5ª hora',m:'Geografía',p:'Claudio Serrano'},{h:'6ª hora',m:'Educación Física',p:'Maxi'}]},
{dia:'Jueves',salida:'13:30',bloques:[{h:'1ª y 2ª hora',m:'Historia',p:'Claudio Serrano'},{h:'3ª y 4ª hora',m:'Lengua',p:'Juliana'},{h:'5ª hora',m:'Ciudadanía',p:'Pablo Alonso'},{h:'6ª hora',m:'Educación Física',p:'Maxi'}]},
{dia:'Viernes',salida:'11:20',bloques:[{h:'1ª hora',m:'Matemática',p:'Hayde Hualpa'},{h:'2ª hora',m:'Geografía',p:'Claudio Serrano'},{h:'3ª hora',m:'Matemática',p:'Hayde Hualpa'},{h:'4ª hora',m:'Inglés',p:'Lorena Botto'}]},
];
const MATERIAS_BASE=[...new Set(HORARIO_BASE.flatMap(d=>d.bloques.map(b=>b.m)))];
const $=s=>document.querySelector(s); const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)); const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
let cur=load('imc_cur',null); let view='inicio';
function initAuth(){if(cur){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');ensureBase();renderNav();go('inicio')} $('#tLogin').onclick=()=>{ $('#fLogin').classList.remove('hidden');$('#fReg').classList.add('hidden')}; $('#tReg').onclick=()=>{ $('#fLogin').classList.add('hidden');$('#fReg').classList.remove('hidden')}; $('#fLogin').onsubmit=e=>{e.preventDefault();let users=load('imc_users',[]);let u=users.find(x=>x.curso.toLowerCase()==$('#lCurso').value.trim().toLowerCase() && x.pass==$('#lPass').value);if(!u){alert('Datos incorrectos');return}cur=u;save('imc_cur',u);location.reload()}; $('#fReg').onsubmit=e=>{e.preventDefault();if($('#rPass').value!=$('#rPass2').value){alert('Contraseñas distintas');return}let users=load('imc_users',[]);let nu={id:Date.now(),nombre:$('#rNom').value,apellido:$('#rApe').value,curso:$('#rCurso').value,pass:$('#rPass').value,nombreRanking:$('#rNom').value,rankingOpt:true};users.push(nu);save('imc_users',users);cur=nu;save('imc_cur',nu);ensureBase();location.reload()};}
function ensureBase(){let mats=load('imc_mats',[]); if(!mats.some(m=>m.userId==cur.id)){let add=MATERIAS_BASE.map(n=>{let prof=HORARIO_BASE.flatMap(d=>d.bloques).find(b=>b.m==n)?.p||'';return {id:Date.now()+Math.random(),userId:cur.id,nombre:n,profesor:prof}}); save('imc_mats',[...mats,...add])} let hors=load('imc_hor',[]); if(!hors.some(h=>h.userId==cur.id)){let add=[];HORARIO_BASE.forEach(d=>{d.bloques.forEach(b=>{add.push({id:Date.now()+Math.random(),userId:cur.id,dia:d.dia,hora:b.h,salida:d.salida,materia:b.m,profesor:b.p})})}); save('imc_hor',[...hors,...add])}}
function logout(){localStorage.removeItem('imc_cur');location.reload()}
function renderNav(){ $('#av').textContent=cur.nombre[0].toUpperCase(); $('#uName').textContent=cur.nombre+' '+cur.apellido; $('#uCurso').textContent=cur.curso; const items=[['inicio','Inicio'],['tareas','Tareas'],['calendario','Calendario'],['horario','Horario'],['materias','Materias'],['notas','Notas'],['plan','Plan de estudio'],['curso','Mi curso'],['ranking','Ranking'],['perfil','Perfil']]; $('#side').innerHTML=items.map(([id,lab])=>`<button onclick="go('${id}')" class="w-full text-left px-3 py-2.5 rounded-lg text-sm ${view==id?'bg-black text-white':'hover:bg-neutral-100 text-neutral-700'}">${lab}</button>`).join(''); $('#bottom').innerHTML=[['inicio','Inicio'],['tareas','Tareas'],['horario','Horario'],['materias','Materias'],['perfil','Perfil']].map(([id,lab])=>`<button onclick="go('${id}')" class="flex flex-col items-center py-1 px-2 ${view==id?'text-black':'text-neutral-400'}"><span class="text-[10px]">${lab}</span></button>`).join('');}
function go(v){view=v;$('#hTitle').textContent=view;renderNav();let c=$('#content'); if(v=='inicio')c.innerHTML=renderInicio(); if(v=='tareas')c.innerHTML=renderTareas(); if(v=='materias')c.innerHTML=renderMaterias(); if(v=='notas')c.innerHTML=renderNotas(); if(v=='calendario')c.innerHTML=renderCalendario(); if(v=='horario')c.innerHTML=renderHorario(); if(v=='curso')c.innerHTML=renderCurso(); if(v=='ranking')c.innerHTML=renderRanking(); if(v=='plan')c.innerHTML=renderPlan(); if(v=='perfil')c.innerHTML=renderPerfil();}
function tUser(){return load('imc_tareas',[]).filter(x=>x.userId==cur.id)} function nUser(){return load('imc_notas',[]).filter(x=>x.userId==cur.id)}
function renderInicio(){ const dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado']; let d=new Date(); let nombreDia=dias[d.getDay()]; let hoyISO=d.toISOString().slice(0,10); let horarioHoy=HORARIO_BASE.find(x=>x.dia==nombreDia); let tareas=tUser(); let hoyT=tareas.filter(t=>t.fecha==hoyISO); return `<div class="grid lg:grid-cols-[1.6fr_.8fr] gap-6"><div class="space-y-6"><div class="bg-white border rounded-xl p-6"><div class="flex justify-between"><div><p class="text-xs uppercase tracking-widest text-neutral-500">${nombreDia} — ${d.toLocaleDateString('es-AR',{day:'numeric',month:'long'})}</p><h2 class="font-serif text-2xl mt-2">Materias de hoy</h2></div><div class="text-right"><p class="text-xs text-neutral-500">SALIDA</p><p class="font-medium">${horarioHoy?.salida||'—'}</p></div></div><div class="mt-6 space-y-3">${horarioHoy?horarioHoy.bloques.map(b=>`<div class="flex justify-between items-center py-3 border-b last:border-0"><div><p class="text-sm font-medium">${b.m}</p><p class="text-xs text-neutral-500">${b.p}</p></div><span class="text-xs border px-2 py-1 rounded-full">${b.h}</span></div>`).join(''):`<p class="text-sm text-neutral-500">Hoy no tenés clases</p>`}</div></div></div><div class="space-y-6"><div class="bg-white border rounded-xl p-5"><h3 class="text-sm font-medium mb-3">Tareas de hoy</h3><div class="space-y-2">${hoyT.length?hoyT.map(t=>`<div class="text-sm py-2 border-b">${t.titulo} — ${t.materia}</div>`).join(''):'<p class="text-sm text-neutral-500">Sin tareas</p>'}</div></div><div class="bg-black text-white rounded-xl p-5"><p class="text-xs uppercase opacity-60">Promedio</p><p class="text-3xl font-serif mt-1">${nUser().length?(nUser().reduce((a,b)=>a+Number(b.nota),0)/nUser().length).toFixed(1):'—'}</p></div></div></div>`}
function renderTareas(){let t=tUser();return `<div class="flex justify-between mb-6"><h3 class="font-serif text-xl">Tareas</h3><button onclick="openM('tarea')" class="bg-black text-white px-4 py-2 rounded-lg text-sm">Nueva</button></div><div class="bg-white border rounded-xl divide-y">${t.map(x=>`<div class="p-4 flex gap-3"><input type="checkbox" ${x.estado=='completada'?'checked':''} onchange="toggleT(${x.id})"><div class="flex-1"><p class="text-sm font-medium ${x.estado=='completada'?'line-through text-neutral-400':''}">${x.titulo}</p><p class="text-xs text-neutral-500">${x.materia} • ${x.fecha} • ${x.prioridad}</p></div></div>`).join('')||'<p class="p-6 text-sm text-neutral-500">Sin tareas</p>'}</div>`}
function renderHorario(){return `<div class="bg-white border rounded-xl p-6"><h3 class="font-serif text-xl mb-6">Horario semanal</h3><div class="grid md:grid-cols-5 gap-6">${HORARIO_BASE.map(d=>`<div><p class="text-sm font-medium border-b pb-2 mb-3">${d.dia} <span class="text-xs text-neutral-500">— ${d.salida}</span></p><div class="space-y-3">${d.bloques.map(b=>`<div class="text-sm"><p class="font-medium">${b.m}</p><p class="text-xs text-neutral-500">${b.h} • ${b.p}</p></div>`).join('')}</div></div>`}
function renderMaterias(){let ms=load('imc_mats',[]).filter(m=>m.userId==cur.id);return `<div class="grid md:grid-cols-3 gap-4">${ms.map(m=>`<div class="bg-white border rounded-xl p-5"><p class="font-serif text-lg">${m.nombre}</p><p class="text-xs text-neutral-500">${m.profesor}</p></div>`).join('')}</div>`}
function renderNotas(){let n=nUser();return `<div class="bg-white border rounded-xl divide-y">${n.map(x=>`<div class="p-4 flex justify-between"><div><p class="text-sm">${x.materia} — ${x.tipo}</p><p class="text-xs text-neutral-500">${x.fecha}</p></div><p class="font-serif">${x.nota}</p></div>`).join('')||'<p class="p-6 text-sm">Sin notas</p>'}<button onclick="openM('nota')" class="m-4 bg-black text-white px-4 py-2 rounded-lg text-sm">Nueva nota</button></div>`}
function renderCalendario(){let ev=load('imc_eventos',[]).filter(e=>e.userId==cur.id);return `<div class="bg-white border rounded-xl divide-y">${ev.map(e=>`<div class="p-4 flex gap-4 text-sm"><span class="font-mono text-xs">${e.fecha}</span><span class="border px-2 py-1 rounded-full text-[10px] uppercase">${e.tipo}</span><span>${e.titulo}</span></div>`).join('')||'<p class="p-6 text-sm">Sin eventos</p>'}<button onclick="openM('evento')" class="m-4 bg-black text-white px-4 py-2 rounded-lg text-sm">Nuevo evento</button></div>`}
function renderCurso(){let users=load('imc_users',[]).filter(u=>u.curso==cur.curso);return `<div class="bg-white border rounded-xl p-6"><h3 class="font-serif text-xl">Mi curso — ${cur.curso}</h3><div class="grid md:grid-cols-3 gap-3 mt-6">${users.map(u=>`<div class="border rounded-lg p-3"><p class="text-sm font-medium">${u.nombre} ${u.apellido}</p></div>`).join('')}</div></div>`}
function renderRanking(){return `<div class="bg-white border rounded-xl p-6"><h3 class="font-serif text-xl">Ranking mensual</h3><p class="text-sm text-neutral-500 mt-2">Se reinicia cada mes. XP por completar tareas.</p></div>`}
function renderPlan(){return `<div class="bg-white border rounded-xl p-6"><h3 class="font-serif text-xl">Plan de estudio</h3><p class="text-sm text-neutral-500 mt-2">Estructura lista para IA. Payload: tareas, examenes, horarios, objetivos.</p><button onclick="openM('plan')" class="mt-4 bg-black text-white px-4 py-2 rounded-lg text-sm">Nuevo bloque</button></div>`}
function renderPerfil(){return `<div class="bg-white border rounded-xl p-6 max-w-[600px]"><h3 class="font-serif text-xl">Perfil</h3><p class="text-sm mt-4">${cur.nombre} ${cur.apellido} — ${cur.curso}</p><button onclick="logout()" class="mt-6 w-full border py-3 rounded-lg text-sm">Cerrar sesión</button></div>`}
function openM(type){let b=$('#mBody');$('#modal').classList.remove('hidden');$('#modal').classList.add('flex'); if(type=='tarea') b.innerHTML=`<h3 class="font-serif text-xl mb-4">Nueva tarea</h3><form id="ft" class="space-y-3"><input name="titulo" required placeholder="Título" class="w-full px-4 py-3 rounded-lg border text-sm"><select name="materia" class="w-full px-4 py-3 rounded-lg border text-sm">${MATERIAS_BASE.map(m=>`<option>${m}</option>`).join('')}</select><input name="fecha" type="date" required class="w-full px-4 py-3 rounded-lg border text-sm"><select name="prio" class="w-full px-4 py-3 rounded-lg border text-sm"><option>Normal</option><option>Importante</option><option>Urgente</option></select><button class="w-full bg-black text-white py-3 rounded-lg text-sm">Guardar</button></form>`; if(type=='nota') b.innerHTML=`<h3 class="font-serif text-xl mb-4">Nueva nota</h3><form id="fn" class="space-y-3"><select name="materia" class="w-full px-4 py-3 rounded-lg border text-sm">${MATERIAS_BASE.map(m=>`<option>${m}</option>`).join('')}</select><input name="nota" type="number" step="0.1" required placeholder="Nota" class="w-full px-4 py-3 rounded-lg border text-sm"><input name="fecha" type="date" required class="w-full px-4 py-3 rounded-lg border text-sm"><button class="w-full bg-black text-white py-3 rounded-lg text-sm">Guardar</button></form>`; if(type=='evento') b.innerHTML=`<h3 class="font-serif text-xl mb-4">Nuevo evento</h3><form id="fe" class="space-y-3"><input name="titulo" required placeholder="Título" class="w-full px-4 py-3 rounded-lg border text-sm"><input name="fecha" type="date" required class="w-full px-4 py-3 rounded-lg border text-sm"><select name="tipo" class="w-full px-4 py-3 rounded-lg border text-sm"><option>examen</option><option>entrega</option><option>feriado</option><option>acto</option></select><button class="w-full bg-black text-white py-3 rounded-lg text-sm">Guardar</button></form>`; setTimeout(()=>{ $('#ft')&&( $('#ft').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target);let a=load('imc_tareas',[]);a.push({id:Date.now(),userId:cur.id,titulo:fd.get('titulo'),materia:fd.get('materia'),fecha:fd.get('fecha'),prioridad:fd.get('prio'),estado:'pendiente'});save('imc_tareas',a);closeM();go('tareas')}); $('#fn')&&( $('#fn').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target);let a=load('imc_notas',[]);a.push({id:Date.now(),userId:cur.id,materia:fd.get('materia'),nota:fd.get('nota'),fecha:fd.get('fecha'),tipo:'Evaluación'});save('imc_notas',a);closeM();go('notas')}); $('#fe')&&( $('#fe').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target);let a=load('imc_eventos',[]);a.push({id:Date.now(),userId:cur.id,titulo:fd.get('titulo'),fecha:fd.get('fecha'),tipo:fd.get('tipo')});save('imc_eventos',a);closeM();go('calendario')}); },50);}
function closeM(){ $('#modal').classList.add('hidden');$('#modal').classList.remove('flex')} $('#modal').onclick=e=>{if(e.target.id=='modal')closeM()} function toggleT(id){let all=load('imc_tareas',[]);let it=all.find(x=>x.id==id);if(it){it.estado=it.estado=='completada'?'pendiente':'completada';save('imc_tareas',all);go(view)}}
initAuth();
</script>
</body>
</html>
